# ==============================================================================
# RSI-Bench: Batch Benchmark Configuration Template
# ==============================================================================
# Copy this file to `config.yaml` (which is gitignored) and fill in your API key:
#
#   OPENROUTER_API_KEY="your-key-here"
#
# To execute in batch via OpenRouter:
#   python run_benchmark.py --config config.yaml
#   python run_benchmark.py --batch
#
# To run offline simulation (no API keys required):
#   python run_benchmark.py --mock --config config.yaml
# ==============================================================================

version: "1"

# Directory where traces (.json), reports (.md), and aggregate CSVs will be saved
output_dir: "results"

# Global default parameters applied to every benchmark run unless overridden
defaults:
  num_turns: 3
  prompt: "Generate a random integer. Do NOT output anything else."
  system_prompt: null
  enable_thinking: true
  thinking_level: "max"  # Reasoning effort / thinking level: "max", "xhigh", "high", "medium", "low"
  thinking_budget: 1024
  temperature: 1.0
  max_tokens: 2048
  enable_caching: true
  use_local_cache: false

# Shared API keys mapped by provider name.
# When using OpenRouter (`provider: openrouter`), ONLY `openrouter` (OPENROUTER_API_KEY) is required!
api_keys:
  openrouter: "${OPENROUTER_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  gemini_interactions: "${GEMINI_API_KEY}"
  gemini: "${GEMINI_API_KEY}"
  openai_chat: "${OPENAI_API_KEY}"
  openai_responses: "${OPENAI_API_KEY}"
  openai_completion: "${OPENAI_API_KEY}"
  deepseek: "${DEEPSEEK_API_KEY}"
  groq: "${GROQ_API_KEY}"
  mistral: "${MISTRAL_API_KEY}"
  together: "${TOGETHER_API_KEY}"
  cohere: "${COHERE_API_KEY}"
  generic_openai: ""

# Custom base URLs for local or proxied models
base_urls:
  generic_openai: "http://localhost:11434/v1"
  deepseek: "https://api.deepseek.com"

# List of benchmark evaluations to execute in batch.
# All 28 models with publicly available APIs from the Artificial Analysis benchmark are configured below.
# (Muse Wonder Full (max) is omitted as it has no publicly available API).
runs:
  # 0. Deterministic Offline Simulation (no API key required)
  - name: "offline-mock-simulation"
    provider: "mock"
    turns: 3
    enabled: true
    tags: ["simulation", "offline", "ci"]

  # 1. Claude Opus 5.5 (max) [Anthropic, Reference Score: 58]
  - name: "Claude Opus 5.5 (max)"
    provider: "openrouter"
    model: "anthropic/claude-opus-5.5"
    turns: 3
    thinking: true
    thinking_level: "max"
    cache: true
    enabled: false
    tags: ["anthropic", "opus", "reasoning"]

  # 2. GPT-6 Astra (max) [OpenAI, Reference Score: 57]
  - name: "GPT-6 Astra (max)"
